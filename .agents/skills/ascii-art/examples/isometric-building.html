<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modular ASCII Architecture — Isometric Tower Complex</title>
  <style>
    body {
      margin: 0;
      background: #080810;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'JetBrains Mono', Consolas, monospace;
      color: #8a8a9e;
      overflow: hidden;
    }
    canvas {
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
    }
    .hud {
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <canvas id="isoCanvas" width="640" height="520"></canvas>
  <div class="hud">2:1 Isometric Axonometric Projection • Painter's Depth Sorting • Sun Angle Shading</div>

  <script>
    const canvas = document.getElementById('isoCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // 2:1 Isometric Tile Metric
    const tileW = 40;
    const tileH = 20;
    const blockH = 28; // Vertical extrusion height
    const originX = W / 2;
    const originY = 380;

    // Convert 3D world (u, v, z) to 2D screen (x, y)
    function isoToScreen(u, v, z) {
      const x = originX + (u - v) * (tileW / 2);
      const y = originY + (u + v) * (tileH / 2) - (z * blockH);
      return { x, y };
    }

    // Draw an isometric block with lit top, dark left shadow, medium right face
    function drawIsoBlock(u, v, z, isWindow = false) {
      const pTopBack = isoToScreen(u, v, z + 1);
      const pTopRight = isoToScreen(u + 1, v, z + 1);
      const pTopFront = isoToScreen(u + 1, v + 1, z + 1);
      const pTopLeft = isoToScreen(u, v + 1, z + 1);

      const pBotLeft = isoToScreen(u, v + 1, z);
      const pBotFront = isoToScreen(u + 1, v + 1, z);
      const pBotRight = isoToScreen(u + 1, v, z);

      // 1. Left Face (In Shadow)
      ctx.beginPath();
      ctx.moveTo(pTopLeft.x, pTopLeft.y);
      ctx.lineTo(pTopFront.x, pTopFront.y);
      ctx.lineTo(pBotFront.x, pBotFront.y);
      ctx.lineTo(pBotLeft.x, pBotLeft.y);
      ctx.closePath();
      ctx.fillStyle = isWindow ? '#1a202c' : '#2d3748';
      ctx.fill();
      ctx.strokeStyle = '#1a202c';
      ctx.stroke();

      // Left face texture glyphs
      ctx.font = 'bold 11px monospace';
      ctx.fillStyle = isWindow ? '#ffd54f' : '#4a5568';
      ctx.fillText(isWindow ? '[*]' : '::', (pTopLeft.x + pBotFront.x) / 2 - 8, (pTopLeft.y + pBotFront.y) / 2);

      // 2. Right Face (Lit by Sun)
      ctx.beginPath();
      ctx.moveTo(pTopFront.x, pTopFront.y);
      ctx.lineTo(pTopRight.x, pTopRight.y);
      ctx.lineTo(pBotRight.x, pBotRight.y);
      ctx.lineTo(pBotFront.x, pBotFront.y);
      ctx.closePath();
      ctx.fillStyle = isWindow ? '#2b6cb0' : '#4a5568';
      ctx.fill();
      ctx.strokeStyle = '#2d3748';
      ctx.stroke();

      // Right face texture glyphs
      ctx.fillStyle = isWindow ? '#ffeb3b' : '#718096';
      ctx.fillText(isWindow ? '[+]' : '||', (pTopFront.x + pBotRight.x) / 2 - 8, (pTopFront.y + pBotRight.y) / 2);

      // 3. Top Face (Direct Zenith Light)
      ctx.beginPath();
      ctx.moveTo(pTopBack.x, pTopBack.y);
      ctx.lineTo(pTopRight.x, pTopRight.y);
      ctx.lineTo(pTopFront.x, pTopFront.y);
      ctx.lineTo(pTopLeft.x, pTopLeft.y);
      ctx.closePath();
      ctx.fillStyle = '#718096';
      ctx.fill();
      ctx.strokeStyle = '#a0aec0';
      ctx.stroke();

      // Top face glyph
      ctx.fillStyle = '#e2e8f0';
      ctx.fillText('++', (pTopBack.x + pTopFront.x) / 2 - 6, (pTopBack.y + pTopFront.y) / 2 + 4);
    }

    // Build Architectural Complex Scene
    const blocks = [];

    // Ground Plaza (5x5 grid)
    for (let u = -3; u <= 3; u++) {
      for (let v = -3; v <= 3; v++) {
        blocks.push({ u, v, z: 0, type: 'plaza' });
      }
    }

    // Main Central Tower (3x3 footprint, 6 stories high)
    for (let z = 1; z <= 6; z++) {
      for (let u = -1; u <= 1; u++) {
        for (let v = -1; v <= 1; v++) {
          const isCorner = (u === 1 || v === 1);
          blocks.push({ u, v, z, isWindow: isCorner && (z % 2 === 0) });
        }
      }
    }

    // Spires & Turrets (Level 7 and 8)
    blocks.push({ u: 0, v: 0, z: 7, isWindow: true });
    blocks.push({ u: 0, v: 0, z: 8, isWindow: false });

    // Step-Down Wing (Level 1-3 on the right)
    for (let z = 1; z <= 3; z++) {
      blocks.push({ u: 2, v: 0, z, isWindow: true });
      blocks.push({ u: 2, v: 1, z, isWindow: true });
    }

    // PAINTER'S ORDER DEPTH SORT: Back to Front (u + v), then Bottom to Top (z)
    blocks.sort((a, b) => {
      const depthA = (a.u + a.v) * 1000 + a.z;
      const depthB = (b.u + b.v) * 1000 + b.z;
      return depthA - depthB;
    });

    // Render Scene with Screen-Space Bloom
    function render() {
      ctx.fillStyle = '#080810';
      ctx.fillRect(0, 0, W, H);

      // Ambient Ground Grid Lines
      for (let u = -5; u <= 5; u++) {
        for (let v = -5; v <= 5; v++) {
          const p = isoToScreen(u, v, 0);
          ctx.fillStyle = '#1a1a2e';
          ctx.font = '10px monospace';
          ctx.fillText('.', p.x, p.y);
        }
      }

      // Draw Depth-Sorted Blocks
      blocks.forEach(b => {
        drawIsoBlock(b.u, b.v, b.z, b.isWindow);
      });
    }

    render();
  </script>
</body>
</html>
